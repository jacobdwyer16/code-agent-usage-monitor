[package]
name = "code-agent-usage-monitor"
version = "2.19.4"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Windows taskbar widget for monitoring code agent usage and rate limits"
homepage = "https://github.com/jacobdwyer16/code-agent-usage-monitor"
repository = "https://github.com/jacobdwyer16/code-agent-usage-monitor"

[package.metadata.winresource]
CompanyName = "Jacob Dwyer"
ProductName = "Code Agent Usage Monitor"
FileDescription = "Windows taskbar widget for monitoring code agent usage and rate limits"
OriginalFilename = "code-agent-usage-monitor.exe"
InternalName = "CodeAgentUsageMonitor"
Comments = "Forked from CodeZeno/Claude-Code-Usage-Monitor"
LegalCopyright = "Copyright (C) 2026 Jacob Dwyer. Forked from Code Zeno Pty Ltd."

[dependencies]
# ureq 3.4.0 gates its connector on native-tls; native-tls-no-default alone panics.
# Both agents still select PlatformVerifier to validate against the Windows store.
ureq = { version = "3.4", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
eframe = { version = "0.36", default-features = false, features = ["glow"] }
lucide-icons = "1.30"
raw-window-handle = "0.6"
egui-directx11 = { version = "=0.13.0", path = "vendor/egui-directx11" }
egui-winit = { version = "0.36", default-features = false, features = ["clipboard"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
epaint_default_fonts = "0.36"
heck = "0.5"
lucide-icons = "1.30"
oxifont-subset = "0.2.2"
proc-macro2 = "1"
serde_json = "1"
toml = "1.1"
winresource = "0.1.31"

[patch.crates-io]
# Keep native text copy/paste without arboard's image codecs. See vendor/egui-winit/PATCH.md.
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
