name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_ASSET_NAME: code-agent-usage-monitor.exe

jobs:
  dependency-security:
    uses: ./.github/workflows/dependency-security.yml
    permissions:
      contents: read

  build:
    needs: dependency-security
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Test updater safeguards
        run: cargo test --locked updater

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/code-agent-usage-monitor.exe
          generate_release_notes: true

